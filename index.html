function assetLoanChart(){const assets=data.assets.filter(a=>!a.is_consumable);if(!assets.length)return '<p class="muted">등록된 기자재가 없습니다.</p>';const active=data.loans.filter(l=>!l.returned_at);const entries=assets.map(a=>({name:a.name,total:Math.max(0,Number(a.quantity)||0),borrowed:active.filter(l=>l.asset_id===a.id).reduce((sum,l)=>sum+(Number(l.quantity)||0),0)})).sort((a,b)=>b.borrowed-a.borrowed||a.name.localeCompare(b.name,'ko'));const max=Math.max(1,...entries.map(e=>Math.max(e.total,e.borrowed)));return '<p class="muted" style="margin:0 0 16px">기자재별 현재 대여 수량 · 총 보유 수량 기준</p><div class="asset-loan-chart">'+entries.map(e=>'<div class="asset-loan-row"><div class="asset-loan-label"><strong>'+esc(e.name)+'</strong><span>대여 '+e.borrowed+'개 / 전체 '+e.total+'개</span></div><div class="asset-loan-track" role="img" aria-label="'+esc(e.name)+' '+e.borrowed+'개 대여 중"><div class="asset-loan-total" style="width:'+(e.total/max*100)+'%"></div><div class="asset-loan-borrowed" style="width:'+(e.borrowed/max*100)+'%"></div></div></div>').join('')+'</div>'}

const xmlEsc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
const excelCell=(v,r,c)=>{let col='';for(let n=c+1;n;n=Math.floor((n-1)/26))col=String.fromCharCode(65+(n-1)%26)+col;const ref=col+r;if(typeof v==='number'&&Number.isFinite(v))return `<c r="${ref}"><v>${v}</v></c>`;const text=String(v??'');return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(text)}</t></is></c>`};
function excelSheet(rows){const body=rows.map((row,i)=>`<row r="${i+1}">${row.map((v,j)=>excelCell(v,i+1,j)).join('')}</row>`).join('');const colCount=Math.max(1,...rows.map(r=>r.length));const cols=Array.from({length:colCount},(_,i)=>{const max=Math.min(46,Math.max(12,...rows.slice(0,300).map(r=>String(r[i]??'').length*1.7+3)));return `<col min="${i+1}" max="${i+1}" width="${max}" customWidth="1"/>`}).join('')||'';return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0" showGridLines="0"/></sheetViews><cols>${cols}</cols><sheetData>${body}</sheetData><autoFilter ref="A1:${String.fromCharCode(64+colCount)}${Math.max(rows.length,1)}"/></worksheet>`}
const le16=n=>[n&255,n>>>8&255],le32=n=>[n&255,n>>>8&255,n>>>16&255,n>>>24&255];
const crcTable=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t.push(c>>>0)}return t})();
function crc32(bytes){let c=0xffffffff;for(const b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0}
function zipXlsx(files){const enc=new TextEncoder(),locals=[],central=[];let offset=0;for(const [name,content] of files){const nm=enc.encode(name),data=enc.encode(content),crc=crc32(data),len=data.length;const local=new Uint8Array([...le32(0x04034b50),...le16(20),...le16(0),...le16(0),...le16(0),...le16(0),...le32(crc),...le32(len),...le32(len),...le16(nm.length),...le16(0),...nm]);locals.push(local,data);central.push(new Uint8Array([...le32(0x02014b50),...le16(20),...le16(20),...le16(0),...le16(0),...le16(0),...le16(0),...le32(crc),...le32(len),...le32(len),...le16(nm.length),...le16(0),...le16(0),...le16(0),...le16(0),...le32(0),...le32(offset),...nm]));offset+=local.length+data.length}const centralSize=central.reduce((a,x)=>a+x.length,0);return new Blob([...locals,...central,new Uint8Array([...le32(0x06054b50),...le16(0),...le16(0),...le16(files.length),...le16(files.length),...le32(centralSize),...le32(offset),...le16(0)])],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
async function downloadMonthlyXlsx(){
 if(!isAdmin())return alert('관리자만 월별 보고서를 다운로드할 수 있습니다.');
 if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month))return alert('올바른 조회 월을 선택하세요.');
 const start=month+'-01T00:00:00+09:00', [yy,mm]=month.split('-').map(Number);

 // RLS: 전체 직원 내역은 관리자에게만 조회 허용. 1000행 기본 제한을 피하기 위해 페이지 조회.
 async function fetchAll(table,field='created_at'){
   let all=[];
   for(let from=0;from<50000;from+=1000){
     const {data:batch,error}=await sb.from(table).select('*').gte(field,startISO).lt(field,end).order(field,{ascending:true}).range(from,from+999);
     if(error)throw Error(table+': '+error.message);
     all.push(...batch);
     if(batch.length<1000)return all;
   }
   throw Error('보고서 기록이 50,000건을 초과합니다. 기간을 나누어 조회해 주세요.');
 }
 try{
  const [loans,withdrawals,incidents,extensions,returns]=await Promise.all([
   fetchAll('sbj_loans'),fetchAll('sbj_withdrawals'),fetchAll('sbj_incidents'),fetchAll('sbj_extensions'),fetchAll('sbj_returns')
  ]);
  const name=id=>nameOf(id), dept=id=>person(id).department||'-';
  const loanStatus=r=>r.returned_at?'반납 완료':new Date(r.due_at)<new Date()?'반납 지연':'대여 중';
  const sheet1=[['대여 일시','대여 ID','기자재','대여자','부서','수량','반납 예정일','실제 반납일','상태'],...loans.map(r=>[fmt(r.created_at),r.id,aBy(r.asset_id)?.name||r.asset_id,name(r.user_id),dept(r.user_id),r.quantity,fmt(r.due_at),fmt(r.returned_at),loanStatus(r)])];
  const sheet2=[['출고 일시','소모품','출고 직원','부서','출고 수량'],...withdrawals.map(r=>[fmt(r.created_at),sBy(r.supply_id)?.name||r.supply_id,name(r.user_id),dept(r.user_id),r.quantity])];
  const sheet3=[['신고 일시','유형','신고 직원','부서','내용','처리 상태','연결 대여 ID'],...incidents.map(r=>[fmt(r.created_at),r.type==='loss'?'분실':'고장',name(r.user_id),dept(r.user_id),r.details,r.status,r.loan_id])];
  const sheet4=[['연장 일시','직원','부서','기존 반납일','변경 반납일','사유'],...extensions.map(r=>[fmt(r.created_at),name(r.user_id),dept(r.user_id),fmt(r.old_due),fmt(r.new_due),r.reason])];
  const sheet5=[['반납 일시','직원','부서','상태','상세','연결 대여 ID'],...returns.map(r=>[fmt(r.created_at),name(r.user_id),dept(r.user_id),r.condition,r.detail,r.loan_id])];
  const returned=loans.filter(r=>r.returned_at).length,late=loans.filter(r=>!r.returned_at&&new Date(r.due_at)<new Date()).length;
  const summary=[['SBJ Asset Hub · 월별 통합 보고서',''],['조회 월',month],['집계 기준','해당 월에 생성된 기록(한국시간)'],['생성 시각',new Date().toLocaleString('ko-KR')],[],['지표','건수'],['총 대여',loans.length],['반납 완료',returned],['대여 중',loans.length-returned],['반납 지연(대여 중 포함)',late],['소모품 출고 건수',withdrawals.length],['소모품 출고 총수량',withdrawals.reduce((n,r)=>n+r.quantity,0)],['고장·분실 신고',incidents.length],['연장 처리',extensions.length],['반납 상태 기록',returns.length],[],['부서','총 대여','반납 완료','대여 중','반납 지연']];
  const departments=[...new Set(loans.map(r=>dept(r.user_id)))].sort();
  for(const d of departments){const subset=loans.filter(r=>dept(r.user_id)===d);summary.push([d,subset.length,subset.filter(r=>r.returned_at).length,subset.filter(r=>!r.returned_at).length,subset.filter(r=>!r.returned_at&&new Date(r.due_at)<new Date()).length]);}
  const sheets=[['월별 요약',summary],['대여 상세',sheet1],['소모품 출고',sheet2],['고장 분실',sheet3],['반납 연장',sheet4],['반납 상태',sheet5]];
  const xesc=xmlEsc;
  const files=[['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
   ['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
   ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map(([n],i)=>`<sheet name="${xesc(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],
   ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}</Relationships>`],
   ...sheets.map(([n,rows],i)=>[`xl/worksheets/sheet${i+1}.xml`,excelSheet(rows)])];
  const blob=zipXlsx(files),url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download=`SBJ_월별보고서_${month}.xlsx`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  notice=`${month} 엑셀 보고서를 생성했습니다.`;render();
 }catch(e){alert('보고서 생성 실패: '+e.message);}
}

function reportsView(){const r=data.loans.filter(x=>String(x.created_at).slice(0,7)===month);return `<h1 class="title">월별 통합 보고서</h1>${panel('조회 월',`<div class="toolbar"><input id="month" type="month" class="input" value="${month}">${button('엑셀(.xlsx) 다운로드','excel')}</div>`)}<div class="cards">${[['총 대여',r.length],['반납 완료',r.filter(x=>x.returned_at).length],['대여 중',r.filter(x=>!x.returned_at).length],['반납 지연',r.filter(x=>!x.returned_at&&new Date(x.due_at)<new Date()).length]].map(([t,n])=>`<div class="card"><label>${t}</label><b>${n}</b></div>`).join('')}</div>${panel('대여 상세',loanTable(r))}`}
function accountsView(){return `<h1 class="title">관리자·계정 관리</h1><p class="subtitle">기존 관리자가 등록된 직원에게 관리자 권한을 부여하거나 회수할 수 있습니다.</p>${panel('등록 직원',tbl(['이름','부서','권한','작업'],data.profiles.map(x=>{const has=data.admins.some(a=>a.user_id===x.user_id);return [esc(x.name),esc(x.department),has?'관리자':'직원',x.user_id===user.id?'내 계정':button(has?'관리자 권한 회수':'관리자로 지정','role:'+x.user_id,true)]})))}<p class="hint">직원이 먼저 계정을 생성하고 로그인해야 목록에 표시됩니다. 권한 변경은 서버에서 관리자 여부를 재검증합니다.</p>`}

function mypage(){return `<h1 class="title">마이페이지</h1>${panel('내 계정',`<form id="profileForm"><p>이메일: ${esc(user.email)}</p><label class="field">이름<input class="input" name="name" value="${esc(profile.name||'')}" required></label><label class="field">부서<input class="input" name="department" value="${esc(profile.department||'')}" required></label><button class="btn">수정</button></form>`)}${panel('계정 보안',`<button class="btn secondary" data-act="reset">비밀번호 재설정 메일 보내기</button><p class="hint">계정 삭제는 관리자에게 요청해 주세요.</p>`)}`}
function content(){return ({home,assets:assetsView,rentals:rentalsView,supplies:suppliesView,history:historyView,requests:requestsView,notifications:notificationsView,reports:reportsView,accounts:accountsView,mypage})[page]?.()||home()}
function authPage(){return `<div class="login-shell"><form class="login-card" id="login"><img class="sbj-logo-login" src="${logo}" alt="회사 로고"><h1 class="auth-heading">SBJ Asset Hub</h1><p class="auth-sub">기업용 기자재 · 소모품 관리 시스템</p><label class="field">이메일<input class="input" type="email" name="email" required autocomplete="email"></label><label class="field">비밀번호<div class="password-wrap"><input class="input" id="pw" type="password" name="password" required autocomplete="current-password"><button class="eye-btn" type="button" id="eye" aria-label="비밀번호 표시" title="비밀번호 표시"><svg id="eyeIcon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></label><div class="auth-error">${esc(notice)}</div><button class="btn">로그인</button><div class="auth-switch"><button type="button" id="forgot">비밀번호 찾기</button></div><p class="hint">회사에서 발급한 계정으로 로그인하세요. 직원 가입은 관리자 초대 방식입니다.</p></form></div>`}
function render(){const root=document.getElementById('root');if(busy){root.innerHTML='<div class="login-shell">데이터를 불러오는 중...</div>';return}if(!user){root.innerHTML=authPage();document.getElementById('eye').onclick=()=>{let p=document.getElementById('pw');p.type=p.type==='password'?'text':'password';const visible=p.type==='text';document.getElementById('eye').setAttribute('aria-label',visible?'비밀번호 숨기기':'비밀번호 표시');document.getElementById('eye').title=visible?'비밀번호 숨기기':'비밀번호 표시';document.getElementById('eyeIcon').innerHTML=visible?'<path d="M3 3l18 18"/><path d="M10.6 5.1A11.8 11.8 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3.1 3.9"/><path d="M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4.3-.9"/><path d="M10 10a3 3 0 0 0 4 4"/>':'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'};document.getElementById('forgot').onclick=async()=>{let email=prompt('비밀번호 재설정 메일을 받을 이메일');if(email){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});alert(error?error.message:'이메일을 확인하세요')}};document.getElementById('login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){notice='로그인 실패: '+error.message;render()}else await init()};return}
root.innerHTML=`<div class="mobile-shade ${menu?'open':''}" id="shade"></div><div class="app"><aside class="sidebar ${menu?'open':''}"><div class="brand"><img class="sbj-logo-sidebar" src="${logo}" alt="회사 로고">SBJ Asset Hub<small>ENTERPRISE ASSET MANAGEMENT</small></div>${nav().map(([id,t,ic])=>`<button class="nav ${page===id?'active':''}" data-page="${id}"><span>${ic}</span> ${t}</button>`).join('')}</aside><main class="main"><header class="top"><div class="inline"><button class="menu-btn" id="menu">☰</button><strong>${esc(nav().find(x=>x[0]===page)?.[1]||'대시보드')}</strong></div><div class="top-right"><span>${esc(profile.name||user.email)} · ${esc(profile.department||'')}</span>${admin?`<button class="btn small secondary" id="switch">${isAdmin()?'직원 모드로 전환':'관리자 모드로 전환'}</button>`:''}<span class="role">${isAdmin()?'관리자':'직원'}</span><button class="btn small secondary" id="logout">로그아웃</button></div></header><div class="content">${notice?`<div class="notice">${esc(notice)}</div>`:''}${content()}<div class="footer">SBJ Asset Hub · Supabase 연동</div></div><nav class="mobile-bottom-nav"><button data-page="home">홈</button><button data-page="assets">기자재</button><button data-page="rentals">대여</button><button id="more">전체 메뉴</button></nav></main></div>`;
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;menu=false;notice='';render()});document.getElementById('menu').onclick=()=>{menu=!menu;render()};document.getElementById('shade').onclick=()=>{menu=false;render()};document.getElementById('more').onclick=()=>{menu=true;render()};document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();user=null;render()};if(admin)document.getElementById('switch').onclick=()=>{view=view==='admin'?'employee':'admin';page='home';render()};document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act));document.querySelectorAll('[data-stage]').forEach(b=>b.onchange=async()=>{await call(sb.from('sbj_incidents').update({status:b.value}).eq('id',b.dataset.stage));await refresh()});let se=document.getElementById('search');if(se)se.onchange=()=>{search=se.value;render()};let mo=document.getElementById('month');if(mo)mo.onchange=()=>{month=mo.value;render()};let af=document.getElementById('addAsset');if(af)af.onsubmit=async e=>{e.preventDefault();let f=new FormData(af);await call(sb.from('sbj_assets').insert({name:f.get('name'),category:f.get('category'),department:f.get('department'),quantity:Number(f.get('quantity')),is_consumable:false}));await refresh()};let sf=document.getElementById('addSupply');if(sf)sf.onsubmit=async e=>{e.preventDefault();let f=new FormData(sf);await call(sb.from('sbj_supplies').insert({name:f.get('name'),quantity:+f.get('quantity'),minimum:+f.get('minimum')}));await refresh()};let pf=document.getElementById('profileForm');if(pf)pf.onsubmit=async e=>{e.preventDefault();let f=new FormData(pf);await call(sb.from('sbj_profiles').update({name:f.get('name'),department:f.get('department')}).eq('user_id',user.id));await init()};}
async function call(q){const {data,error}=await q;if(error){notice=error.message;alert('처리 실패: '+error.message);return null}notice='저장되었습니다.';return data??true}
async function action(key){const [kind,id]=key.split(':');if(kind==='role'){if(!isAdmin())return alert('관리자 전용 기능입니다.');const target=data.profiles.find(x=>x.user_id===id);if(!target||id===user.id)return;const grant=!data.admins.some(x=>x.user_id===id);if(!confirm(`${target.name||'해당 직원'}의 관리자 권한을 ${grant?'부여':'회수'}할까요?`))return;const ok=await call(sb.rpc('sbj_set_admin',{p_user:id,p_make_admin:grant}));if(ok)await refresh();return;}if(kind==='reset'){const {error}=await sb.auth.resetPasswordForEmail(user.email,{redirectTo:location.origin+location.pathname});return alert(error?error.message:'메일을 확인하세요')}
if(kind==='excel'){await downloadMonthlyXlsx();return}
let n,txt,dt;if(kind==='rent'){dt=prompt('반납 예정일 (YYYY-MM-DD)',day(new Date(Date.now()+86400000)));if(!dt)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||dueDate(dt)<=new Date().toISOString())return alert('올바른 미래 날짜를 입력하세요');await call(sb.rpc('sbj_checkout',{p_asset:id,p_quantity:1,p_due:dueDate(dt)}))}
if(kind==='return'){const condition=prompt('반납 상태: 정상 / 고장 / 부품 누락','정상');if(!condition)return;const detail=condition==='정상'?'':prompt('문제 상세 설명')||'';await call(sb.rpc('sbj_return_with_condition',{p_loan:id,p_condition:condition,p_detail:detail}))}
if(kind==='extend'){dt=prompt('새 반납 예정일 YYYY-MM-DD');if(!dt)return;txt=prompt('연장 사유');if(!txt)return;await call(sb.rpc('sbj_extend_with_reason',{p_loan:id,p_due:dueDate(dt),p_reason:txt}))}
if(kind==='incident'){txt=prompt('고장 또는 분실 내용을 입력하세요');if(!txt)return;const type=confirm('분실 신고라면 확인을 누르세요. 취소하면 고장 신고입니다.')?'loss':'damage';await call(sb.from('sbj_incidents').insert({loan_id:id,user_id:user.id,type,details:txt,status:'reported'}))}
if(kind==='take'){n=Number(prompt('출고 수량'));if(!Number.isInteger(n)||n<1)return;await call(sb.rpc('sbj_take_supply',{p_supply:id,p_quantity:n}))}
if(kind==='supplyedit'||kind==='supplydelete'){if(!isAdmin())return alert('관리자 전용 기능입니다.');const s=sBy(id);if(!s)return alert('품목을 찾을 수 없습니다.');if(kind==='supplydelete'){if(!confirm('['+s.name+'] 품목을 삭제할까요? 기존 출고 내역이 있으면 삭제되지 않을 수 있습니다.'))return;const {error}=await sb.from('sbj_supplies').delete().eq('id',id).select('id');if(error)return alert('삭제 실패: '+error.message);notice='품목이 삭제되었습니다.';await refresh();return;}const name=prompt('품목명',s.name);if(name===null)return;if(!name.trim())return alert('품목명을 입력하세요.');const qty=prompt('현재 재고',s.quantity);if(qty===null)return;const min=prompt('최소 재고',s.minimum);if(min===null)return;const quantity=Number(qty),minimum=Number(min);if(!Number.isSafeInteger(quantity)||quantity<0||!Number.isSafeInteger(minimum)||minimum<0)return alert('재고는 0 이상의 정수로 입력하세요.');const result=await call(sb.from('sbj_supplies').update({name:name.trim(),quantity,minimum}).eq('id',id).select('id'));if(result)await refresh();return;}
if(kind==='restock'){n=Number(prompt('입고 수량'));if(!Number.isInteger(n)||n<1)return;const s=sBy(id);await call(sb.from('sbj_supplies').update({quantity:s.quantity+n}).eq('id',id))}
if(kind==='assetqty'){n=Number(prompt('총 수량',aBy(id)?.quantity));if(!Number.isInteger(n)||n<0)return;await call(sb.from('sbj_assets').update({quantity:n}).eq('id',id))}
if(kind==='cancel'){await call(sb.from('sbj_reservations').update({status:'cancelled'}).eq('id',id))}await refresh()}
async function refresh(){const specs=[['assets','sbj_assets'],['loans','sbj_loans'],['supplies','sbj_supplies'],['withdrawals','sbj_withdrawals'],['extensions','sbj_extensions'],['returns','sbj_returns'],['reservations','sbj_reservations'],['incidents','sbj_incidents'],['alerts','sbj_alerts'],['profiles','sbj_profiles'],['admins','sbj_admins']];const result=await Promise.all(specs.map(async([key,t])=>({key,...await sb.from(t).select('*').limit(2000)})));for(const r of result){if(r.error){notice=`${r.key}: ${r.error.message}`;data[r.key]=[]}else data[r.key]=r.data||[]}render()}
async function init(){busy=true;render();const {data:{user:u},error}=await sb.auth.getUser();user=error?null:u;if(!user){busy=false;render();return}const [p,a]=await Promise.all([sb.from('sbj_profiles').select('*').eq('user_id',user.id).maybeSingle(),sb.from('sbj_admins').select('user_id').eq('user_id',user.id).maybeSingle()]);profile=p.data||{};admin=!!a.data;if(p.error||a.error)notice=p.error?.message||a.error?.message;busy=false;await refresh()}
sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){user=null;busy=false;render()}});init();setInterval(()=>{if(user&&page==='home'||page==='rentals')document.querySelectorAll('.remaining').forEach(()=>{});},30000);
</script></body></html>
