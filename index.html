async function downloadMonthlyXlsx(){

 if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month))return showToast('올바른 조회 월을 선택하세요.');
 const start=month+'-01T00:00:00+09:00', [yy,mm]=month.split('-').map(Number);
 const end=new Date(Date.UTC(yy,mm,1)-9*3600000).toISOString();

 async function fetchAll(table,field='created_at'){
   let all=[];
   for(let from=0;from<50000;from+=1000){
     const {data:batch,error}=await sb.from(table).select('*').gte(field,startISO).lt(field,end).order(field,{ascending:true}).range(from,from+999);
     if(error)throw Error(table+': '+error.message);
     all.push(...batch);
     if(batch.length<1000)return all;
   }
   throw Error('보고서 기록이 50,000건을 초과합니다. 기간을 나누어 조회해 주세요.');
 }
 try{
  const [loans,withdrawals,incidents,extensions,returns]=await Promise.all([
   fetchAll('sbj_loans'),fetchAll('sbj_withdrawals'),fetchAll('sbj_incidents'),fetchAll('sbj_extensions'),fetchAll('sbj_returns')
  ]);
  const name=id=>nameOf(id), dept=id=>person(id).department||'-';

function showToast(message,isError=false){document.querySelector('.sbj-toast')?.remove();const el=document.createElement('div');el.className='sbj-toast'+(isError?' error':'');el.setAttribute('role','alert');const span=document.createElement('span');span.textContent=String(message);const close=document.createElement('button');close.type='button';close.textContent='×';close.setAttribute('aria-label','닫기');close.onclick=()=>el.remove();el.append(close,span);document.body.append(el)}
function enhanceMobileTables(){document.querySelectorAll('.tablewrap table').forEach(table=>{const heads=[...table.querySelectorAll('thead th')].map(x=>x.textContent.trim());if(!heads.some(x=>x.includes('대여자')||x.includes('반납 예정일')))return;table.classList.add('mobile-card-table');table.querySelectorAll('tbody tr').forEach(row=>[...row.querySelectorAll('td')].forEach((td,i)=>td.setAttribute('data-label',heads[i]||'정보')))});}
function bindCalendarDetails(){document.querySelectorAll('.cal-day[data-date]').forEach(cell=>cell.addEventListener('click',()=>{const date=cell.dataset.date;document.querySelectorAll('.cal-day.selected').forEach(x=>x.classList.remove('selected'));cell.classList.add('selected');const selected=data.loans.filter(r=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(r.created_at))===date);const detail=document.getElementById('sbjCalendarDetail');if(!detail)return;detail.hidden=false;detail.innerHTML='<div class="sbj-cal-backdrop" id="sbjCalBackdrop"><section class="sbj-cal-modal" role="dialog" aria-modal="true" aria-labelledby="sbjCalTitle"><div class="sbj-cal-modal-head"><h4 id="sbjCalTitle">'+esc(date)+' 대여 내역 ('+selected.length+'건 · 총 '+selected.reduce((sum,r)=>sum+Number(r.quantity||0),0)+'개)</h4><button type="button" class="sbj-cal-close" id="sbjCalClose" aria-label="닫기">×</button></div><div class="sbj-cal-modal-body">'+(selected.length?'<ul>'+selected.map(r=>'<li>'+esc(nameOf(r.user_id))+' · '+esc(aBy(r.asset_id)?.name||'기자재')+' · '+esc(String(r.quantity||1))+'개 · '+(r.returned_at?'반납 완료':'대여 중')+'</li>').join('')+'</ul>':'<p>이 날짜에 대여한 기록이 없습니다.</p>')+'</div></section></div>';const overlay=document.getElementById('sbjCalBackdrop');const close=()=>{detail.hidden=true;detail.innerHTML='';document.removeEventListener('keydown',onKey)};const onKey=e=>{if(e.key==='Escape')close()};document.getElementById('sbjCalClose').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',onKey);document.getElementById('sbjCalClose').focus() }));}
function loanCalendar(rows){const [y,m]=month.split('-').map(Number),offset=new Date(y,m-1,1).getDay(),total=new Date(y,m,0).getDate(),days=['일','월','화','수','목','금','토'];let html='<div class="loan-calendar">'+days.map(x=>'<b>'+x+'</b>').join('');for(let i=0;i<offset;i++)html+='<div class="cal-empty"></div>';for(let d=1;d<=total;d++){const key=month+'-'+String(d).padStart(2,'0'),items=rows.filter(r=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(r.created_at))===key);html+='<button type="button" class="cal-day" data-date="'+key+'" data-count="'+items.length+'" data-qty="'+items.reduce((sum,r)=>sum+Number(r.quantity||0),0)+'" aria-label="'+key+' 대여 '+items.length+'건, 총 '+items.reduce((sum,r)=>sum+Number(r.quantity||0),0)+'개"><strong>'+d+'</strong>'+items.slice(0,2).map(r=>'<div class="cal-entry">'+esc(nameOf(r.user_id))+' · '+esc(aBy(r.asset_id)?.name||'기자재')+' '+(r.quantity||1)+'개</div>').join('')+(items.length>2?'<div class="cal-more">+'+(items.length-2)+'건 더보기</div>':'')+'</button>'}return html+'</div><div id="sbjCalendarDetail" class="sbj-cal-detail" aria-live="polite" hidden></div><p class="muted">날짜를 누르면 대여 상세 내역이 표시됩니다. 대여 시작일 기준입니다.</p>'}

if(kind==='loanhide'||kind==='loanrestore'){if(!isAdmin())return showToast('관리자 전용 기능입니다.',true);const l=data.loans.find(x=>x.id===id);if(!l)return showToast('기록을 찾을 수 없습니다.',true);if(kind==='loanhide'&&!l.returned_at)return showToast('반납 완료된 기록만 삭제할 수 있습니다.',true);if(!confirm(kind==='loanhide'?'"'+(aBy(l.asset_id)?.name||'기자재')+'" · '+nameOf(l.user_id)+' · '+l.quantity+'개 기록을 숨길까요? 원본은 보존됩니다.':'이 대여 기록을 복원할까요?'))return;const {data:done,error}=await sb.rpc('sbj_set_loan_hidden',{p_loan:id,p_hidden:kind==='loanhide'});if(error||!done)return showToast('기록 처리 실패: '+(error?.message||'상태를 확인해 주세요.'),true);showToast(kind==='loanhide'?'삭제된 기록으로 이동했습니다.':'복원했습니다.');await refresh();return}

if(kind==='extend'){dt=prompt('새 반납 예정일 (YYYY-MM-DD)');if(dt===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||!Number.isFinite(new Date(dueDate(dt)).getTime())||dueDate(dt)<=new Date().toISOString())return showToast('올바른 반납 예정일을 입력해 주세요.',true);txt=prompt('연장 사유');if(!txt)return;await call(sb.rpc('sbj_extend_with_reason',{p_loan:id,p_due:dueDate(dt),p_reason:txt}))}
if(kind==='incident'){openIncidentDialog(id);return}
if(kind==='take'){n=Number(prompt('출고 수량'));if(!Number.isInteger(n)||n<1)return;await call(sb.rpc('sbj_take_supply',{p_supply:id,p_quantity:n}))}
if(kind==='supplyarchive'){if(!isAdmin())return showToast('관리자 전용 기능입니다.',true);const item=sBy(id);if(!item||item.archived_at)return showToast('소모품을 찾을 수 없습니다.',true);if(!confirm('"'+item.name+'" 소모품을 보관할까요? 재고 목록에서 숨겨지며 기존 출고 기록은 유지됩니다.'))return;const {data:updated,error}=await sb.from('sbj_supplies').update({archived_at:new Date().toISOString()}).eq('id',id).is('archived_at',null).select('id');if(error||!updated?.length)return showToast('보관 실패: '+(error?.message||'권한을 확인해 주세요.'),true);showToast('보관되었습니다.');await refresh();return;}if(kind==='supplyedit'||kind==='supplydelete'){if(!isAdmin())return showToast('관리자 전용 기능입니다.');const s=sBy(id);if(!s)return showToast('품목을 찾을 수 없습니다.');openItemDialog('supply',s,kind==='supplydelete');return;}
if(kind==='restock'){n=Number(prompt('입고 수량'));if(!Number.isInteger(n)||n<1)return;const s=sBy(id);await call(sb.from('sbj_supplies').update({quantity:s.quantity+n}).eq('id',id))}
if(kind==='assetarchive'){if(!isAdmin())return showToast('관리자 전용 기능입니다.',true);const a=aBy(id);if(!a||a.archived_at)return showToast('기자재를 찾을 수 없습니다.',true);if(data.loans.some(l=>l.asset_id===id&&!l.returned_at))return showToast('현재 대여 중인 기자재는 보관할 수 없습니다. 먼저 반납 처리해 주세요.',true);if(!confirm('"'+a.name+'" 기자재를 보관할까요? 보관하면 대여 목록에서 숨겨지고 기존 기록은 유지됩니다.'))return;const {data:updated,error}=await sb.from('sbj_assets').update({archived_at:new Date().toISOString()}).eq('id',id).is('archived_at',null).select('id');if(error||!updated?.length)return showToast('보관 실패: '+(error?.message||'권한을 확인해 주세요.'),true);showToast('보관되었습니다.');await refresh();return;}if(kind==='assetedit'||kind==='assetdelete'){if(!isAdmin())return showToast('관리자 전용 기능입니다.');const a=aBy(id);if(!a)return showToast('기자재를 찾을 수 없습니다.');openItemDialog('asset',a,kind==='assetdelete');return;}
if(kind==='assetqty'){n=Number(prompt('총 수량',aBy(id)?.quantity));if(!Number.isSafeInteger(n)||n<0)return showToast('0 이상의 정수를 입력하세요.');const borrowed=data.loans.filter(r=>r.asset_id===id&&!r.returned_at).reduce((sum,r)=>sum+(Number(r.quantity)||0),0);if(n<borrowed)return showToast('현재 대여 중인 '+borrowed+'개보다 적게 설정할 수 없습니다.');await call(sb.from('sbj_assets').update({quantity:n}).eq('id',id))}
if(kind==='cancel'){await call(sb.from('sbj_reservations').update({status:'cancelled'}).eq('id',id))}await refresh()}
async function refresh(){if(!user)return;const refreshUserId=user.id;const specs=[['assets','sbj_assets'],['loans','sbj_loans'],['supplies','sbj_supplies'],['withdrawals','sbj_withdrawals'],['extensions','sbj_extensions'],['returns','sbj_returns'],['reservations','sbj_reservations'],['incidents','sbj_incidents'],['alerts','sbj_alerts'],['profiles','sbj_profiles'],['admins','sbj_admins']];const [result,stockResult]=await Promise.all([Promise.all(specs.map(async([key,t])=>({key,...await sb.from(t).select('*').limit(2000)}))),sb.rpc('sbj_available_stock')]);if(!user||user.id!==refreshUserId)return;stockReady=!stockResult.error;if(stockReady)stockByAsset=Object.fromEntries((stockResult.data||[]).map(r=>[r.asset_id,Number(r.available)]));else{stockByAsset={};notice='재고 조회 실패: '+stockResult.error.message+' (로그인 상태를 확인하고 다시 시도해 주세요.)'}for(const r of result){if(r.error){notice=`${r.key}: ${r.error.message}`;data[r.key]=[]}else data[r.key]=r.data||[]}if(user){const recent=await sb.rpc('sbj_dashboard_recent_loans');allLoanError=recent.error?.message||'';allLoanRows=recent.data||[]}render()}
async function init(){busy=true;render();const {data:{user:u},error}=await sb.auth.getUser();user=error?null:u;if(!user){busy=false;render();return}const [p,a]=await Promise.all([sb.from('sbj_profiles').select('*').eq('user_id',user.id).maybeSingle(),sb.from('sbj_admins').select('user_id').eq('user_id',user.id).maybeSingle()]);profile=p.data||{};if(profile.deactivated_at){await sb.auth.signOut();user=null;profile={};admin=false;notice='비활성화된 계정입니다. 관리자에게 문의해 주세요.';busy=false;render();return}admin=!!a.data;if(!admin){view='employee';if(['notifications','reports','accounts'].includes(page))page='home'}if(p.error||a.error)notice=p.error?.message||a.error?.message;busy=false;await refresh()}
sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){user=null;busy=false;stockReady=false;stockByAsset={};notice='';render()}});init();setInterval(()=>{if(user&&page==='home'||page==='rentals')document.querySelectorAll('.remaining').forEach(()=>{});},30000);
</script></body></html>
