<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SBJ Asset Hub</title><style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#16243c;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button{border:0;border-radius:9px;padding:10px 14px;background:#165bd6;color:white}button.secondary{background:#e9f0fb;color:#2052a4}button.danger{background:#ffebeb;color:#aa3030}button:disabled{opacity:.5}.wrap{max-width:1260px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.brand{font-size:24px;font-weight:850;color:#165bd6}.muted{color:#738095;font-size:13px}.panel{background:white;border:1px solid #e2e8f1;border-radius:16px;padding:22px;margin:14px 0;box-shadow:0 2px 8px #14254407}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{background:white;color:#53617a}.nav button.active{background:#165bd6;color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{font-size:28px;font-weight:800;margin-top:8px}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.tools input{flex:1;min-width:180px}input,select,textarea{border:1px solid #d9e1ed;border-radius:9px;padding:10px;background:white;min-width:0}label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:650}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form .full{grid-column:1/-1}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:12px 9px;border-bottom:1px solid #edf0f5;text-align:left}th{color:#66748a;font-weight:650}.scroll{overflow:auto}.pill{border-radius:99px;padding:4px 8px;background:#e8f5ef;color:#16704b;white-space:nowrap}.late{background:#fff0ef;color:#b84235}.login{max-width:430px;margin:9vh auto}.login h1{color:#165bd6}h2{font-size:18px;margin:0 0 16px}.small{font-size:12px}.msg{color:#a33;min-height:20px}.notice{border-left:3px solid #165bd6;padding:12px;margin:8px 0;background:#f7faff}.right{margin-left:auto}@media(max-width:750px){.wrap{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.head{align-items:flex-start}td,th{white-space:nowrap}}
</style></head><body><div id="app"></div><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const URL='https://zmymzxwkfqftjfgnuntd.supabase.co',KEY='sb_publishable_sZS2aOk0R9ResfXz_BptuQ_ih6Qgjqf';
const sb=createClient(URL,KEY),app=document.getElementById('app');let session=null,profile=null,admin=false,tab='home',assets=[],loans=[],reservations=[],incidents=[],alerts=[],people=[],audit=[],filter='',authMode='login';
const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=x=>x?new Date(x).toLocaleString('ko-KR'):'-';const today=()=>new Date().toISOString().slice(0,10);const formData=f=>Object.fromEntries(new FormData(f));const uid=()=>session?.user?.id;const say=x=>alert(x);const err=x=>x?.message||String(x);const stock=a=>a.quantity-loans.filter(l=>l.asset_id===a.id&&!l.returned_at).reduce((n,l)=>n+l.quantity,0);const asset=id=>assets.find(a=>a.id===id)?.name||'삭제된 장비';const username=id=>people.find(p=>p.user_id===id)?.name||(id===uid()?profile?.name:'직원');
async function fetchAll(){const requests=[['sbj_assets','assets'],['sbj_loans','loans'],['sbj_reservations','reservations'],['sbj_incidents','incidents'],['sbj_alerts','alerts'],['sbj_profiles','people']];if(admin)requests.push(['sbj_audit','audit']);for(const [table,key] of requests){const {data,error}=await sb.from(table).select('*').order('created_at',{ascending:false}).limit(2000);if(error){console.error(table,error);continue}({assets:v=>assets=v,loans:v=>loans=v,reservations:v=>reservations=v,incidents:v=>incidents=v,alerts:v=>alerts=v,people:v=>people=v,audit:v=>audit=v})[key](data||[])}render()}
// JWT is issued and refreshed by Supabase Auth; do not decode and trust a token manually.
let authGeneration=0;
function clearPrivateState(){session=null;profile=null;admin=false;assets=[];loans=[];reservations=[];incidents=[];alerts=[];people=[];audit=[];}
async function init(){
 const generation=++authGeneration;
 const {data:{session:currentSession},error:sessionError}=await sb.auth.getSession();
 if(sessionError||!currentSession?.access_token){if(generation===authGeneration){clearPrivateState();render()}return}
 // getClaims verifies the JWT signature and expiry (Supabase handles token refresh).
 const {data:claimData,error:claimError}=await sb.auth.getClaims(currentSession.access_token);
 if(claimError||!claimData?.claims?.sub||claimData.claims.sub!==currentSession.user.id){if(generation===authGeneration){clearPrivateState();render()}return}
 const {data:{user},error:userError}=await sb.auth.getUser();
 if(generation!==authGeneration)return;
 if(userError||!user||user.id!==claimData.claims.sub){clearPrivateState();render();return}
 session=currentSession;
 const p=await sb.from('sbj_profiles').select('*').eq('user_id',user.id).maybeSingle();
 if(generation!==authGeneration)return;
 profile=p.data;
 // Admin status is always queried from the server, never from editable JWT user_metadata.
 const a=await sb.rpc('sbj_is_admin');
 if(generation!==authGeneration)return;
 admin=!a.error&&a.data===true;
 await fetchAll();
}
sb.auth.onAuthStateChange((ev,s)=>{
 if(ev==='PASSWORD_RECOVERY'){session=s;setTimeout(()=>showPasswordRecovery(),0);return}
 if(ev==='SIGNED_OUT'){++authGeneration;clearPrivateState();setTimeout(render,0);return}
 if(ev==='SIGNED_IN'||ev==='TOKEN_REFRESHED'||ev==='USER_UPDATED')setTimeout(init,0)
});
function showPasswordRecovery(){
 app.innerHTML=`<div class="login panel"><h1>새 비밀번호 설정</h1><form id="changePassword" class="form"><label class="full">새 비밀번호<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label class="full">비밀번호 확인<input name="confirm" type="password" minlength="8" autocomplete="new-password" required></label><button class="full">비밀번호 변경</button></form><p class="msg" id="message"></p></div>`;
 document.getElementById('changePassword').onsubmit=async ev=>{ev.preventDefault();const f=formData(ev.target),m=document.getElementById('message');if(f.password!==f.confirm){m.textContent='비밀번호가 일치하지 않습니다.';return}const {error}=await sb.auth.updateUser({password:f.password});if(error){m.textContent=err(error);return}m.textContent='비밀번호가 변경되었습니다.';setTimeout(init,0)}
}
function auth(){app.innerHTML=`<div class="login panel"><h1>SBJ Asset Hub</h1><p class="muted">기업용 기자재 · 소모품 관리</p><div class="tools"><button class="${authMode==='login'?'':'secondary'}" data-mode="login">로그인</button><button class="${authMode==='signup'?'':'secondary'}" data-mode="signup">회원가입</button><button class="secondary" data-mode="reset">비밀번호 재설정</button></div><form id="auth" class="form">${authMode==='signup'?'<label class="full">이름<input name="name" required></label><label class="full">부서<input name="department" required></label>':''}<label class="full">이메일<input type="email" name="email" required></label>${authMode!=='reset'?(authMode==='signup'?'<label class="full">비밀번호<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>':'<label class="full">비밀번호<input type="password" name="password" autocomplete="current-password" required></label>'):''}<button class="full">${authMode==='login'?'로그인':authMode==='signup'?'계정 생성':'재설정 이메일 보내기'}</button></form><p class="muted">계정과 데이터는 Supabase에 안전하게 저장됩니다. 관리자 지정은 별도 설정이 필요합니다.</p><p class="msg" id="message"></p></div>`;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{authMode=b.dataset.mode;auth()});document.getElementById('auth').onsubmit=async ev=>{ev.preventDefault();const f=formData(ev.target),m=document.getElementById('message');m.textContent='처리 중...';let result;if(authMode==='login')result=await sb.auth.signInWithPassword({email:f.email,password:f.password});else if(authMode==='reset')result=await sb.auth.resetPasswordForEmail(f.email,{redirectTo:location.origin+location.pathname});else result=await sb.auth.signUp({email:f.email,password:f.password,options:{data:{name:f.name,department:f.department}}});if(result.error){m.textContent=err(result.error);return}if(authMode==='signup'){m.textContent='가입 요청 완료. 이메일 인증을 완료한 뒤 로그인하세요. 인증이 비활성화된 프로젝트에서는 즉시 로그인될 수 있습니다.';}else if(authMode==='reset')m.textContent='재설정 이메일을 확인하세요.';else await init()}}
const buttons=[['home','대시보드'],['assets','기자재 / 소모품'],['loans','대여 · 반납'],['reservations','예약'],['incidents','파손 · 분실'],['alerts','알림'],...(admin?[['people','직원 / 부서'],['audit','감사 기록'],['report','보고서']]:[])];
function render(){if(!session)return auth();const unread=alerts.filter(x=>!x.read_at).length;app.innerHTML=`<div class="wrap"><header class="head"><div><div class="brand">SBJ Asset Hub</div><div class="muted">${e(profile?.name||session.user.email)} · ${e(profile?.department||'부서 미설정')} · ${admin?'관리자':'직원'}</div></div><div class="tools"><button class="secondary" id="refresh">새로고침</button><button class="secondary" id="logout">로그아웃</button></div></header><nav class="nav">${buttons.map(([id,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${label}${id==='alerts'&&unread?' ('+unread+')':''}</button>`).join('')}</nav><main>${content()}</main><p class="muted small">SBJ Asset Hub · Supabase 기반 공동 데이터 · 이메일 발송 없음</p></div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.getElementById('refresh').onclick=fetchAll;document.getElementById('logout').onclick=()=>sb.auth.signOut();wire()}
function content(){const active=loans.filter(l=>!l.returned_at);if(tab==='home')return `<div class="grid">${[['등록 물품',assets.length],['현재 대여',active.length],['반납 지연',active.filter(l=>new Date(l.due_at)<new Date()).length],['읽지 않은 알림',alerts.filter(x=>!x.read_at).length]].map(([k,v])=>`<div class="panel"><div class="muted">${k}</div><div class="stat">${v}</div></div>`).join('')}</div><div class="panel"><h2>곧 반납할 물품</h2>${active.filter(l=>admin||l.user_id===uid()).sort((a,b)=>new Date(a.due_at)-new Date(b.due_at)).slice(0,8).map(l=>`<div class="notice">${e(asset(l.asset_id))} · ${date(l.due_at)} ${new Date(l.due_at)<new Date()?'<span class="pill late">연체</span>':''}</div>`).join('')||'대여 기록이 없습니다.'}</div>`;
if(tab==='assets')return `<div class="panel"><h2>기자재 및 소모품</h2><div class="tools"><input id="search" placeholder="이름 · 분류 · 관리번호 검색" value="${e(filter)}"><button class="secondary" id="searchBtn">검색</button>${admin?'<button id="addAsset">물품 등록</button><button class="secondary" id="importCsv">CSV 일괄 등록</button><input type="file" id="csvFile" accept=".csv" hidden>':''}</div><div class="scroll"><table><thead><tr><th>물품명</th><th>분류</th><th>관리번호</th><th>부서</th><th>재고 / 총량</th><th>종류</th><th>작업</th></tr></thead><tbody>${assets.filter(a=>(a.name+' '+a.category+' '+a.serial).toLowerCase().includes(filter.toLowerCase())).map(a=>`<tr><td>${e(a.name)}</td><td>${e(a.category)}</td><td>${e(a.serial||'-')}</td><td>${e(a.department||'-')}</td><td>${stock(a)} / ${a.quantity}</td><td>${a.is_consumable?'소모품':'기자재'}</td><td><button data-borrow="${a.id}" ${stock(a)<=0?'disabled':''}>대여</button> ${admin?`<button class="secondary" data-edit="${a.id}">수정</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
if(tab==='loans')return `<div class="panel"><h2>${admin?'전체 대여 내역':'내 대여 내역'}</h2><div class="scroll"><table><thead><tr><th>물품</th><th>사용자</th><th>수량</th><th>대여일</th><th>반납 기한</th><th>상태</th><th>작업</th></tr></thead><tbody>${loans.map(l=>`<tr><td>${e(asset(l.asset_id))}</td><td>${e(username(l.user_id))}</td><td>${l.quantity}</td><td>${date(l.created_at)}</td><td>${date(l.due_at)}</td><td>${l.returned_at?'<span class="pill">반납 완료</span>':new Date(l.due_at)<new Date()?'<span class="pill late">연체</span>':'대여 중'}</td><td>${l.returned_at?'':`<button data-return="${l.id}">반납</button> <button class="secondary" data-extend="${l.id}">연장</button>`}</td></tr>`).join('')}</tbody></table></div></div>`;
if(tab==='reservations')return `<div class="panel"><h2>예약 관리</h2><button id="newReservation">예약하기</button><div class="scroll"><table><tr><th>물품</th><th>직원</th><th>예약일</th><th>수량</th><th>상태</th><th>작업</th></tr>${reservations.map(r=>`<tr><td>${e(asset(r.asset_id))}</td><td>${e(username(r.user_id))}</td><td>${e(r.reserved_for)}</td><td>${r.quantity}</td><td>${e(r.status)}</td><td>${r.status==='active'?`<button class="secondary" data-cancel="${r.id}">취소</button>`:''}</td></tr>`).join('')}</table></div></div>`;
if(tab==='incidents')return `<div class="panel"><h2>파손 · 분실 신고</h2><button id="newIncident">신고하기</button><div class="scroll"><table><tr><th>물품</th><th>유형</th><th>설명</th><th>상태</th><th>신고일</th><th>작업</th></tr>${incidents.map(i=>`<tr><td>${e(asset(loans.find(l=>l.id===i.loan_id)?.asset_id))}</td><td>${i.type==='damage'?'파손':'분실'}</td><td>${e(i.details)}</td><td>${e(i.status)}</td><td>${date(i.created_at)}</td><td>${admin?`<button class="secondary" data-incident="${i.id}">상태 변경</button>`:''}</td></tr>`).join('')}</table></div></div>`;
if(tab==='alerts')return `<div class="panel"><h2>사이트 내부 알림</h2><p class="muted">반납 24시간 이내 또는 연체 시 자동 생성됩니다. 사이트 접속 후 확인할 수 있습니다.</p>${alerts.map(a=>`<div class="notice"><strong>${a.kind==='overdue'?'반납 기한 초과':'반납 24시간 이내'}</strong> · ${e(asset(loans.find(l=>l.id===a.loan_id)?.asset_id))}<div class="muted">${date(a.created_at)}</div>${a.read_at?'<span class="pill">읽음</span>':`<button class="secondary" data-read="${a.id}">읽음 처리</button>`}</div>`).join('')||'알림이 없습니다.'}</div>`;
if(tab==='people')return `<div class="panel"><h2>직원 / 부서 현황</h2><div class="scroll"><table><tr><th>이름</th><th>부서</th><th>사용자 ID</th></tr>${people.map(p=>`<tr><td>${e(p.name)}</td><td>${e(p.department)}</td><td>${e(p.user_id)}</td></tr>`).join('')}</table></div></div>`;
if(tab==='audit')return `<div class="panel"><h2>감사 기록</h2><div class="scroll"><table><tr><th>일시</th><th>작업</th><th>대상</th><th>사용자</th></tr>${audit.map(a=>`<tr><td>${date(a.created_at)}</td><td>${e(a.action)}</td><td>${e(a.entity_id)}</td><td>${e(username(a.actor_id))}</td></tr>`).join('')}</table></div></div>`;
if(tab==='report')return `<div class="panel"><h2>월별 대여 보고서</h2><div class="tools"><input type="month" id="month" value="${today().slice(0,7)}"><button id="download">CSV 다운로드 (Excel에서 열기)</button></div><p class="muted">대여 월 기준으로 기록을 내보냅니다.</p></div>`;return ''}
function wire(){const q=(s)=>document.querySelector(s);if(q('#searchBtn'))q('#searchBtn').onclick=()=>{filter=q('#search').value;render()};if(q('#addAsset'))q('#addAsset').onclick=()=>assetForm();if(q('#importCsv')){q('#importCsv').onclick=()=>q('#csvFile').click();q('#csvFile').onchange=async ev=>{const file=ev.target.files[0];if(!file)return;const lines=(await file.text()).replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);const rows=lines.slice(1).map(line=>{const v=line.split(',');return{name:v[0]?.trim(),category:v[1]?.trim()||'기자재',serial:v[2]?.trim(),department:v[3]?.trim(),quantity:Number(v[4]||1),is_consumable:v[5]?.trim()==='true'}}).filter(x=>x.name);if(!confirm(`${rows.length}개 물품을 등록할까요? CSV 열 순서: name,category,serial,department,quantity,is_consumable`))return;const{error}=await sb.from('sbj_assets').insert(rows);if(error)say(err(error));else await fetchAll()}}
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>assetForm(assets.find(a=>a.id===b.dataset.edit)));document.querySelectorAll('[data-borrow]').forEach(b=>b.onclick=async()=>{const a=assets.find(x=>x.id===b.dataset.borrow);const quantity=Number(prompt(`${a.name} 대여 수량`,1));if(!Number.isInteger(quantity)||quantity<1)return;const due=prompt('반납 예정일 (YYYY-MM-DD)',today());if(!due)return;const{error}=await sb.rpc('sbj_checkout',{p_asset:a.id,p_quantity:quantity,p_due:new Date(due+'T23:59:59+09:00').toISOString()});if(error)say(err(error));else await fetchAll()});document.querySelectorAll('[data-return]').forEach(b=>b.onclick=async()=>{if(!confirm('반납 처리할까요?'))return;const{error}=await sb.rpc('sbj_return',{p_loan:b.dataset.return});if(error)say(err(error));else await fetchAll()});document.querySelectorAll('[data-extend]').forEach(b=>b.onclick=async()=>{const l=loans.find(x=>x.id===b.dataset.extend),due=prompt('변경할 반납일 (YYYY-MM-DD)',new Date(l.due_at).toISOString().slice(0,10));if(!due)return;const{error}=await sb.rpc('sbj_extend',{p_loan:l.id,p_due:new Date(due+'T23:59:59+09:00').toISOString()});if(error)say(err(error));else await fetchAll()});
if(q('#newReservation'))q('#newReservation').onclick=async()=>{const id=prompt('예약할 물품의 ID\n'+assets.map(a=>`${a.name}: ${a.id}`).join('\n'));if(!assets.some(a=>a.id===id))return;const day=prompt('예약일 (YYYY-MM-DD)',today());if(!day)return;const{error}=await sb.from('sbj_reservations').insert({asset_id:id,user_id:uid(),reserved_for:day});if(error)say(err(error));else await fetchAll()};document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{const{error}=await sb.from('sbj_reservations').update({status:'cancelled'}).eq('id',b.dataset.cancel);if(error)say(err(error));else await fetchAll()});if(q('#newIncident'))q('#newIncident').onclick=async()=>{const my=loans.filter(l=>l.user_id===uid());const id=prompt('신고할 대여 ID\n'+my.map(l=>`${asset(l.asset_id)}: ${l.id}`).join('\n'));if(!my.some(l=>l.id===id))return;const type=prompt('유형: damage(파손) 또는 loss(분실)','damage');if(!['damage','loss'].includes(type))return;const details=prompt('상세 내용');if(!details)return;const{error}=await sb.from('sbj_incidents').insert({loan_id:id,user_id:uid(),type,details});if(error)say(err(error));else await fetchAll()};document.querySelectorAll('[data-incident]').forEach(b=>b.onclick=async()=>{const status=prompt('상태: reported / processing / resolved','processing');if(!['reported','processing','resolved'].includes(status))return;const{error}=await sb.from('sbj_incidents').update({status}).eq('id',b.dataset.incident);if(error)say(err(error));else await fetchAll()});document.querySelectorAll('[data-read]').forEach(b=>b.onclick=async()=>{const{error}=await sb.from('sbj_alerts').update({read_at:new Date().toISOString()}).eq('id',b.dataset.read);if(error)say(err(error));else await fetchAll()});if(q('#download'))q('#download').onclick=()=>{const month=q('#month').value,rows=[['물품','직원','부서','수량','대여일','반납기한','실제반납일'],...loans.filter(l=>l.created_at.slice(0,7)===month).map(l=>[asset(l.asset_id),username(l.user_id),people.find(p=>p.user_id===l.user_id)?.department||'',l.quantity,l.created_at,l.due_at,l.returned_at||''])];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`SBJ_대여보고서_${month}.csv`;a.click();URL.revokeObjectURL(url)}}
function assetForm(a){const modal=document.createElement('dialog');modal.style.cssText='border:0;border-radius:16px;padding:24px;width:min(95vw,550px)';modal.innerHTML=`<h2>${a?'물품 수정':'물품 등록'}</h2><form id="assetForm" class="form"><label>물품명<input name="name" required value="${e(a?.name||'')}"></label><label>분류<input name="category" value="${e(a?.category||'기자재')}"></label><label>관리번호<input name="serial" value="${e(a?.serial||'')}"></label><label>부서<input name="department" value="${e(a?.department||'')}"></label><label>총 수량<input type="number" min="0" name="quantity" required value="${a?.quantity??1}"></label><label>소모품<select name="is_consumable"><option value="false">아니요</option><option value="true" ${a?.is_consumable?'selected':''}>예</option></select></label><label class="full">메모<textarea name="notes">${e(a?.notes||'')}</textarea></label><div class="tools full"><button>저장</button><button type="button" class="secondary" id="close">취소</button></div></form>`;document.body.append(modal);modal.showModal();modal.querySelector('#close').onclick=()=>modal.close();modal.onclose=()=>modal.remove();modal.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const f=formData(ev.target),payload={...f,quantity:Number(f.quantity),is_consumable:f.is_consumable==='true'};const{error}=a?await sb.from('sbj_assets').update(payload).eq('id',a.id):await sb.from('sbj_assets').insert(payload);if(error)say(err(error));else{modal.close();await fetchAll()}}}
init();
</script></body></html>
